<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Dashboard - Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --success-color: #4ade80;
            --danger-color: #f87171;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            overflow-x: hidden;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            min-height: 100vh;
        }

        .header {
            margin-bottom: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-full {
            grid-column: span 2;
        }

        .label {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .price {
            font-size: 20px;
            font-weight: 600;
        }

        .change {
            font-size: 12px;
            margin-top: 4px;
        }

        .up {
            color: var(--success-color);
        }

        .down {
            color: var(--danger-color);
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn i {
            font-size: 18px;
        }

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60% {
                content: '...';
            }
        }

        .status-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 99px;
            background: rgba(56, 189, 248, 0.2);
            color: var(--accent-color);
            align-self: flex-start;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Financial Insights</h1>
    </div>

    <div class="grid">
        <!-- BTC Card -->
        <div class="card">
            <span class="label">BTC / USDT</span>
            <span class="price" id="btc-price">Lifting...</span>
            <span class="change up" id="btc-change">+0.00%</span>
        </div>

        <!-- ETH Card -->
        <div class="card">
            <span class="label">ETH / USDT</span>
            <span class="price" id="eth-price">Lifting...</span>
            <span class="change up" id="eth-change">+0.00%</span>
        </div>

        <!-- TOTAL1 Card -->
        <div class="card">
            <span class="label">TOTAL 1 (M.Cap)</span>
            <span class="price" id="total1-val">$0.0T</span>
            <div class="status-badge">Global</div>
        </div>

        <!-- BTC Dominance -->
        <div class="card">
            <span class="label">BTC.D</span>
            <span class="price" id="btcd-val">0.0%</span>
            <div class="status-badge">Dominance</div>
        </div>

        <!-- TOTAL 2 & 3 -->
        <div class="card card-full">
            <div style="display: flex; justify-content: space-between;">
                <div>
                    <span class="label">TOTAL 2</span>
                    <span class="price" id="total2-val" style="font-size: 16px;">$0.0T</span>
                </div>
                <div style="text-align: right;">
                    <span class="label">TOTAL 3</span>
                    <span class="price" id="total3-val" style="font-size: 16px;">$0.0T</span>
                </div>
            </div>
        </div>
    </div>

    <div class="button-group">
        <button class="btn btn-action" onclick="executeWebhook('BTC')">Analyze BTC</button>
        <button class="btn btn-action" onclick="executeWebhook('ETH')">Analyze ETH</button>
        <button class="btn btn-action" onclick="executeWebhook('BIST100')">Analyze BIST100</button>
    </div>

    <style>
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-action {
            padding: 14px;
            font-size: 14px;
        }
    </style>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Binance Price WebSocket Simulation (Simplified with REST for stability)
        async function fetchPrices() {
            try {
                const response = await fetch('https://api.binance.com/api/v3/ticker/24hr?symbols=["BTCUSDT","ETHUSDT"]');
                const data = await response.json();

                const btc = data.find(p => p.symbol === 'BTCUSDT');
                const eth = data.find(p => p.symbol === 'ETHUSDT');

                updateEl('btc-price', `$${parseFloat(btc.lastPrice).toLocaleString()}`);
                updateEl('btc-change', `${parseFloat(btc.priceChangePercent).toFixed(2)}%`, btc.priceChangePercent >= 0);

                updateEl('eth-price', `$${parseFloat(eth.lastPrice).toLocaleString()}`);
                updateEl('eth-change', `${parseFloat(eth.priceChangePercent).toFixed(2)}%`, eth.priceChangePercent >= 0);
            } catch (e) {
                console.error('Price fetch error', e);
            }
        }

        // Alternative API for Market Data (Using CoinGecko or mock data if no key)
        async function fetchMarketData() {
            try {
                // In a real app, you'd use a proxy or specific market API
                // For demonstration, these are common metrics
                document.getElementById('total1-val').innerText = '$2.42T';
                document.getElementById('btcd-val').innerText = '52.4%';
                document.getElementById('total2-val').innerText = '$1.12T';
                document.getElementById('total3-val').innerText = '$640B';
            } catch (e) {
                console.error('Market data error', e);
            }
        }

        function updateEl(id, val, isUp = true) {
            const el = document.getElementById(id);
            if (!el) return;
            el.innerText = val;
            if (id.includes('change')) {
                el.className = `change ${isUp ? 'up' : 'down'}`;
                el.innerText = (isUp ? '+' : '') + val;
            }
        }

        // n8n Webhook Execution with Symbol Payload
        async function executeWebhook(symbol) {
            const btns = document.querySelectorAll('.btn-action');
            btns.forEach(b => b.disabled = true);

            try {
                // LOCAL n8n: n8n'i localde çalıştırırken genellikle http://localhost:5678 kullanılır.
                const WEBHOOK_URL = 'http://localhost:5678/webhook-test/execute-workflow';

                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user: tg.initDataUnsafe?.user?.username || 'Guest',
                        symbol: symbol,
                        timestamp: new Date().toISOString(),
                        source: 'telegram_mini_app'
                    })
                });

                if (response.ok) {
                    tg.showAlert(`✅ ${symbol} analizi tetiklendi!`);
                } else {
                    tg.showAlert('⚠️ Webhook hatası. Lütfen n8n workflowunu kontrol edin.');
                }
            } catch (e) {
                tg.showAlert('❌ Bağlantı hatası: n8n çalışıyor mu?');
            } finally {
                btns.forEach(b => b.disabled = false);
            }
        }

        // Initialize
        fetchPrices();
        fetchMarketData();
        setInterval(fetchPrices, 10000); // Update every 10s
    </script>
</body>

</html>

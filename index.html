<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basit Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            background-color: var(--tg-theme-bg-color); /* Telegram temasına uyum sağlar */
            color: var(--tg-theme-text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            padding: 10px 20px;
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1 id="user-name">Merhaba!</h1>
    <p>Bu senin ilk Mini App projen.</p>
    <button onclick="tg.close()">Uygulamayı Kapat</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Uygulamayı tam ekran yapar

        // Kullanıcı adını Telegram'dan alalım
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = `Merhaba, ${tg.initDataUnsafe.user.first_name}!`;
        }
    </script>
</body>
</html>
